name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the commit each tag pointed at rather than to the tag itself:
      # a tag is mutable, and this workflow runs project code straight after
      # these two steps. Update the SHA and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # Nothing to cache, and a restored cache is code this job would run.
          package-manager-cache: false

      # The layout geometry exists twice — once in JavaScript for the panel
      # preview, once in Lua for Hyprland. tests/model.test.js runs the
      # generated Lua through the real interpreter and diffs the two, so the
      # interpreter has to be here or the most important test silently skips.
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Model tests
        run: node --test tests/model.test.js

      - name: Manifest
        run: |
          jq -e '.schemaVersion == 1' manifest.json
          jq -e '.id | test("^[A-Za-z0-9][A-Za-z0-9._-]*$")' manifest.json
          for entry in $(jq -r '.entryPoints[]' manifest.json); do
            test -f "$entry" || { echo "missing entry point: $entry"; exit 1; }
          done
